name: check

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo clippy --all-features --all-targets -- -D warnings

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo check --all-features

  # TR-R-032. The `rtu` feature is off by default, so the default build must
  # keep compiling without the serial backend and the featured build must
  # compile with it. Checking only `--all-features` would hide a break in
  # either direction.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo check
      - run: cargo check --features rtu

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo test --all-features

  # NF-R-003, CL-R-004, SV-R-006. Builds for a bare-metal target with no default
  # features, so the `no_std` guarantee is checked by the compiler rather than
  # asserted in prose. A `std` dependency reintroduced anywhere in the frame area
  # fails here, as does a client, server, or transport item escaping its `std`
  # gate — which is why those two requirements have no unit test of their own.
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add thumbv7em-none-eabi
      - run: cargo build --target thumbv7em-none-eabi --no-default-features

  # Coverage floor. 80% of lines, enforced -- not advisory. See AGENTS.md
  # "Test-driven": the floor catches untested modules, it does not certify
  # tested ones.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo llvm-cov --all-features --fail-under-lines 80 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: lcov.info
