# A ferrowl Modbus server device matching what `tests/interop_tcp.rs` expects:
# unit 1, two coils at 0-1, a discrete input at 0, and holding plus input
# registers at 0-7.
#
# Run it with (from this repo's root):
#
#   ferrowl run --module name=interop-srv,device=tests/interop/ferrowl-server.toml,\
#     transport=tcp,ip=127.0.0.1,port=5020,role=server
#
# then `cargo test --test interop_tcp -- --ignored --test-threads=1`.
description = "rust-modbus interop fixture"

[definitions.coil0]
slave_id = 1
kind = "Coil"
address = 0
type = "U16"
access = "ReadWrite"
default = 0

[definitions.coil1]
slave_id = 1
kind = "Coil"
address = 1
type = "U16"
access = "ReadWrite"
default = 0

[definitions.discrete0]
slave_id = 1
kind = "DiscreteInput"
address = 0
type = "U16"
access = "ReadOnly"
default = 1

[definitions.holding0]
slave_id = 1
kind = "HoldingRegister"
address = 0
type = "U16"
access = "ReadWrite"
default = 0

[definitions.input0]
