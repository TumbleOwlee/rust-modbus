[package]
name = "rust-modbus"
version = "0.1.0"
edition = "2024"
# NF-R-005. Verified by the `msrv` CI job, not merely declared. The floor is set
# by `let` chains in the frame layer, stable since 1.88; edition 2024 alone would
# only require 1.85. Raising this is a normative change (NF-R-007).
rust-version = "1.88"
description = "Async Modbus client and server over RTU and TCP"
license = "MIT"
readme = "README.md"
repository = "https://github.com/TumbleOwlee/rust-modbus"
keywords = ["modbus", "rtu", "tcp", "async", "industrial"]
categories = ["network-programming", "asynchronous"]

[features]
# NF-R-002. The frame area is `core` + `alloc` only and never needs this; the
# client, server, and transport areas require it, since Tokio does. Default-on
# so the common case stays ergonomic, and CI builds without it (NF-R-003) so a
# `std` dependency cannot creep back into the frame area unnoticed.
default = ["std"]
std = ["dep:tokio"]
# TR-R-032. Off by default so a TCP-only consumer acquires no serial
# dependency; the frame area's RTU *framing* is not gated, only opening a port.
rtu = ["std", "dep:tokio-serial"]
# TR-R-051. Off by default; implies `rtu` so RS-485 configuration is only
# reachable through the serial opener it configures. Linux-only in effect
# (TR-R-054): the ioctl this feature gates is declared only under
# `target_os = "linux"`, so the `libc` dependency below is scoped there and
# never enters a non-Linux dependency tree.
rs485 = ["rtu", "dep:libc"]
# NF-R-025. Off by default; gates Serialize/Deserialize on the domain value
# types and the configuration types. `default-features = false` with only
# `derive` and `alloc` so enabling it never pulls in `std` on a `no_std` build
# and never enables a serde data format as a transitive dependency.
serde = ["dep:serde"]

# NF-R-004. Every dependency below carries `default-features = false` and names
# only the features the crate actually uses. This table is where that
# requirement is enforced; there is no Rust test that can state it.
[dependencies]
crc = { version = "3.4.0", default-features = false }
thiserror = { version = "2.0.19", default-features = false }
winnow = { version = "1.0.4", default-features = false, features = ["alloc", "ascii", "binary"] }
# The async runtime (ARCHITECTURE.md). Optional so the bare-metal build of
# NF-R-003 keeps it out entirely.
# `sync`, `rt` and `macros` are the server's: a `watch` channel for shutdown, a
# `JoinSet` of connection tasks, and `select!`. Without them the crate builds
# only because `[dev-dependencies]` enables them and Cargo unifies features
# across targets — a library-only consumer would not compile.
tokio = { version = "1.53", optional = true, default-features = false, features = ["net", "io-util", "time", "sync", "rt", "macros"] }
# The only maintained async serial port for Tokio; wraps `serialport`.
tokio-serial = { version = "5.5", optional = true, default-features = false }
# NF-R-025. `derive` and `alloc` only: no `std`, so the bare-metal build of
# NF-R-003 stays `no_std` with `serde` enabled, and no serde data format
# (`serde_json`, `serde_yaml`, ...) is pulled in transitively.
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }

# TR-R-050, TR-R-055. The `TIOCSRS485` ioctl is declared by neither `libc` nor
# `nix`, but the raw syscall plumbing (`ioctl`, error numbers) is `libc`'s.
# Scoped to Linux since the feature is Linux-only in effect (TR-R-054), so no
# other target's dependency tree acquires it.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true, default-features = false }

[dev-dependencies]
# FR-R-130 (no panic on any input) and FR-R-133 (round-trip) are universally
# quantified; a property test states them directly where a fixture list only
# samples them. Dev-only -- nothing reaches a consumer's dependency tree.
proptest = "1"
# The runtime and the in-memory duplex pair every transport test runs on.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "test-util"] }
# The pty test pinning TR-R-053 needs a real pty pair; only `openpty` is used.
nix = { version = "0.29", default-features = false, features = ["term"] }
# Exercises the serde round trips against real JSON text (NF-R-025). Dev-only.
serde_json = "1"

[lints.clippy]
# Every fallible call in non-test code documents why it cannot fail via
# `expect("...")`. Tests are exempt (see clippy.toml).
unwrap_used = "deny"
# Wire input is untrusted: no decode path may panic on a peer's bytes.
indexing_slicing = "deny"
panic = "deny"
